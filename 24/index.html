<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudfare.com/ajax/libs/font-awesome/0.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <nav class="navbar">
        <div class="logo">
        <div class="logo"><img src="./asset/logo.png" alt=""></div>
        </div>
        <ul class="nav-links">
            <li><a href="#"></a>Home</li>
            <li><a href="#"></a>Service</li>
            <li><a href="#"></a>Contact</li>
            <li><a href="#"></a>About</li>
        </ul>
        <div class="nav-right">
            <div class="search-box">
                <img src="./asset/lúp.png" alt="">
                <span>Search</span>
            </div>
            <img src="./asset/sii.png" alt="">
            <img src="./asset/global.png" alt="">
        </div>
        </nav>
        <div class="glass-form">
            <h2>Sign Up</h2>
            <p class="subtitle">Already a member? <a href="#">Log in</a></p>

            <form>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" required>
                </div>
                <button type="submit" class="signup-btn">Sign Up</button>
            </form>

            <div class="divider">
                <span>or sign up with</span>
            </div>
            <div class="social-icons">
                <a href="#" class="fb">
                    <img src="./asset/facebook.svg" alt="">
                </a>
                <a href="#" class="google">
                    <img src="./asset/google.svg" alt="">
                </a>
            </div>
        </div>
    </div>
</body>
</html>
